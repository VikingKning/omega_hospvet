name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm se toma de "packageManager" en package.json, no se
      # fija aquí: pnpm/action-setup@v4 falla si se declara en ambos lugares.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Formato (Prettier)
        run: pnpm run format:check

      - name: Tests
        run: pnpm test
